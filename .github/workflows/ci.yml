name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Checks every build of the workspace:
#   * the default (host) build of lumio-core + lumio-sim,
#   * the unit tests of the simulator,
#   * the bare-metal firmware for the RP2040, including conversion to UF2,
#   * the simulator library for WebAssembly.
# The simulator deployment (see deploy-sim.yml) only builds the wasm app, so
# the host and firmware builds need a job of their own.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          build-warnings: ""

      - name: Cache Rust build state
        uses: Swatinem/rust-cache@v2

      # The firmware links with flip-link, see .cargo/config.toml.
      - name: Install flip-link
        uses: taiki-e/install-action@v2
        with:
          tool: flip-link

      - name: Install elf2uf2-rs
        run: cargo install elf2uf2-rs --version 2.2.0 --locked

      - name: Build workspace
        run: cargo build --locked

      - name: Run tests
        run: cargo test --locked

      - name: Build firmware
        run: cargo build --locked -p lumio-firmware --target thumbv6m-none-eabi

      - name: Check firmware ELF ABI
        run: |
          readelf -h target/thumbv6m-none-eabi/debug/lumio-firmware \
            | grep -q 'OS/ABI:.*UNIX - System V'

      - name: Convert firmware to UF2
        run: |
          elf2uf2-rs target/thumbv6m-none-eabi/debug/lumio-firmware /tmp/lumio.uf2
          test -s /tmp/lumio.uf2

      - name: Build simulator
        run: cargo build --locked -p lumio-sim --target wasm32-unknown-unknown --release
