name: Deploy Simulator

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build simulator
        run: |
          # Project Pages sites are served under /<repo-name>/; user/org Pages
          # repos (<owner>.github.io) are served from the root.
          BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          if [ "$BASE_PATH" = "/${GITHUB_REPOSITORY%/*}.github.io" ]; then
            BASE_PATH=""
          fi
          BASE_PATH="${BASE_PATH}/"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" != "closed" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            cd sim
            trunk build --release --public-url "${BASE_PATH}${PR_NUM}/"
            cd ..
            mkdir -p "_site/${PR_NUM}"
            cp -r sim/dist/* "_site/${PR_NUM}/"
            test -f "_site/${PR_NUM}/styles.css" || cp sim/styles.css "_site/${PR_NUM}/styles.css"
            touch "_site/${PR_NUM}/.nojekyll"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            cd sim
            trunk build --release --public-url "${BASE_PATH}"
            cd ..
            mkdir -p _site
            cp -r sim/dist/* _site/
            # Diagnostic: shows exactly what trunk emitted (check this in CI logs).
            find sim/dist -type f | sort
            # Defensive: some trunk versions rewrite the CSS link but skip copying
            # the plain-CSS asset into dist.
            test -f _site/styles.css || cp sim/styles.css _site/styles.css
            # Skip Jekyll processing on GitHub Pages (protects wasm/js/css assets).
            touch _site/.nojekyll
          else
            echo "No build action for this event"
            exit 0
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'github-pages-previews' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Find existing comment
        id: fc
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- sim-preview -->'

      - name: Compute preview URL
        id: url
        run: |
          BASE="${{ needs.deploy.outputs.page_url }}"
          # Ensure trailing slash handling
          PREV="${BASE%/}/${{ github.event.pull_request.number }}"
          echo "prev=$PREV" >> $GITHUB_OUTPUT

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- sim-preview -->
            Simulator preview deployed: [${{ steps.url.outputs.prev }}](${{ steps.url.outputs.prev }})
          edit-mode: replace

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
      pull-requests: write
    concurrency:
      group: pages-main
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # deploy-pages replaces the whole artifact, so rebuilding from main
      # (without the closed PR's preview) removes the stale /<PR_NUM>/ directory.
      - name: Rebuild site from main
        run: |
          BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          if [ "$BASE_PATH" = "/${GITHUB_REPOSITORY%/*}.github.io" ]; then
            BASE_PATH=""
          fi
          BASE_PATH="${BASE_PATH}/"
          cd sim
          trunk build --release --public-url "${BASE_PATH}"
          cd ..
          mkdir -p _site
          cp -r sim/dist/* _site/
          find sim/dist -type f | sort
          test -f _site/styles.css || cp sim/styles.css _site/styles.css
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Find existing comment
        id: fc
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- sim-preview -->'

      - name: Update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- sim-preview -->
            Preview removed (PR closed).
          edit-mode: replace
