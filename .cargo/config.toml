[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Choose a default "cargo run" tool (see README for more info)
# - `probe-rs` provides flashing and defmt via a hardware debugger, and stack unwind on panic
# - elf2uf2-rs loads firmware over USB when the rp2040 is in boot mode
#runner = "probe-rs run --chip RP2040 --protocol swd"
runner = "elf2uf2-rs -d"

rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",

  # Code-size optimizations.
  #   trap unreachable can save a lot of space, but requires nightly compiler.
  #   uncomment the next line if you wish to enable it
  # "-Z", "trap-unreachable=no",
  "-C", "inline-threshold=5",
  "-C", "no-vectorize-loops",
]

# NOTE: `[build] target` is intentionally *not* set. It would force every
# workspace member (including the wasm simulator) onto thumbv6m. Build the
# firmware with the alias below, or pass `--target thumbv6m-none-eabi`.
# The rustflags/runner above are target-gated, so they only apply to arm builds.

[alias]
firmware = "build -p lumio-firmware --target thumbv6m-none-eabi"
firmware-release = "build -p lumio-firmware --target thumbv6m-none-eabi --release"
flash = "run -p lumio-firmware --target thumbv6m-none-eabi"

[env]
DEFMT_LOG = "debug"
